spring:
  application:
    name: museumly-backend
#  datasource:
#    url: ${DB_URL}
#    username: ${DB_USER}
#    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # Flyway creates the schema; Hibernate only checks it
    open-in-view: false # avoids hidden lazy-loading queries in controllers

google:
  oauth:
    client-id: 1057344497240-av316rha473pnc31eeglphsfcdq80eid.apps.googleusercontent.com

jwt:
  secret: ${JWT_SECRET} # addes as environmetn variable through ide.
  ttl: 30d # 30 DAYS, not minutes.

museumly:
  import:
    met:
      enabled: true
      csv-path: MetObjects.csv # relative to the working dir (project root)

logging:
  pattern:
    level: "%5p [user=%X{userId:-anonymous}]"